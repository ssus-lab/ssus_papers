title: SSUS title-page format
author: Eli Knaap
version: 0.0.2
quarto-required: ">=1.4.11"

# The standalone submission title page — the separate document journals
# want beside a blinded manuscript: full title, authors with affiliations,
# corresponding author's contact, postal blocks, short title, word count,
# funding statements, declarations, and the acknowledgments that the blind
# manuscript cannot carry. It reads the real author block from the project's
# config (the template keeps it in _quarto.yml), and prints each author's
# email and ORCID beside the name.
#
#   quarto render title-page.qmd --to ssus-titlepage-pdf
#
# Provenance: the block structure and field access adapted from
# hikmah-manuscript v0.0.13's before-body.tex title page (Andrew Heiss,
# andrewheiss/hikmah-academic-quarto, MIT), re-helmed for a standalone,
# pdfLaTeX-safe document: no fontspec, no \orcidlink (plain URL text — the
# package is too young to trust a journal's build), no image, no color.
# Lmodern for text, Nimbus Sans (helvet) for the label voice; drop the
# helvet line for a pure-CM page if a journal's build lacks psnfss.
#
# Install as a dependency with its siblings, never by copying the folders
# in: `quarto add ssus-lab/ssus_papers@<tag>`. A hand copy, partially
# re-synced, once left a stale format elsewhere in the house, and quarto
# silently fell back to plain pdf/html.

contributes:
  formats:
    pdf:
      documentclass: article
      papersize: letter
      fontsize: 12pt
      geometry:
        - top=1in
        - bottom=1in
        - left=1in
        - right=1in
      indent: false
      block-headings: false
      keep-tex: true
      pdf-engine: pdflatex
      colorlinks: true
      linkcolor: black
      urlcolor: black
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
      include-in-header:
        - include-in-header.tex