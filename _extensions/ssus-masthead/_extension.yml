title: SSUS working-paper masthead format
author: Eli Knaap
version: 0.0.4
quarto-required: ">=1.4.11"
# Built from the hikmah core (Andrew Heiss, andrewheiss/hikmah-academic-quarto
# v0.0.7, MIT): include-in-header.tex and the before-body/title partials are
# adapted copies. Retyped to the SSUS brand (IBM Plex Serif and IBM Plex Math
# for the body and its mathematics, Libre Franklin 400/600/800 for the
# masthead, headings, and captions, IBM Plex Mono for code and data),
# recolored to the brand palette, and its centered title block
# replaced by the working-paper masthead from the brand identity sheet
# (Surface 02): mark, series line, title, authors, footer rule with the lab
# line and the date. On Quarto >= 1.10 the preamble tail splices via
# before-title.tex and the title page emits from before-body.tex; hikmah's
# original partial layout predates those region semantics, so the split
# follows the quarto 1.10 template. An html target carries the same masthead
# (title-block.html, masthead.css) with the night mark and palette wired for
# prefers-color-scheme, and the avatar as favicon (a data-URI header splice —
# the schema's favicon key is website-only, and this format must work in
# plain document projects).
contributes:
  formats:
    pdf:
      # the fonts and the mark are copied beside the render, so the
      # extension works at any install depth — org-nested by quarto add
      # (ssus-lab/ssus_papers -> _extensions/ssus-lab/ssus-masthead/) or
      # hand-vendored (_extensions/ssus-masthead/)
      format-resources:
        - assets/fonts/IBMPlexSerif-Regular.otf
        - assets/fonts/IBMPlexSerif-Italic.otf
        - assets/fonts/IBMPlexSerif-SemiBold.otf
        - assets/fonts/IBMPlexSerif-SemiBoldItalic.otf
        - assets/fonts/IBMPlexMath-Regular.otf
        - assets/fonts/LibreFranklin-Regular.ttf
        - assets/fonts/LibreFranklin-Italic.ttf
        - assets/fonts/LibreFranklin-SemiBold.ttf
        - assets/fonts/LibreFranklin-SemiBoldItalic.ttf
        - assets/fonts/LibreFranklin-ExtraBold.ttf
        - assets/fonts/LibreFranklin-ExtraBoldItalic.ttf
        - assets/fonts/IBMPlexMono-Regular.ttf
        - assets/fonts/IBMPlexMono-SemiBold.ttf
        - assets/ssus-mark-light.pdf
      template-partials:
        - "partials/before-title.tex"
        - "partials/before-body.tex"
      include-in-header:
        - "include-in-header.tex"
      csl: assets/apa.csl
      # 11 pt on a 6 in measure: about 88 characters to the line in Plex
      # Serif, where 10 pt on 6.5 in set about 100
      fontsize: 11pt
      geometry:
        - top=1in
        - bottom=1in
        - left=1.25in
        - right=1.25in
        - heightrounded
        - footskip=25pt
      colorlinks: true
      link-citations: true
      cite-method: citeproc
      # APA now ships in assets/: the unpatched apa.csl (DOIs printed, the
      # APA print convention) for the pdf, apa-web.csl (source-DOI-URL
      # neutralized; link-bibliography hyperlinks titles instead) for the
      # html. biblio-config retired (no longer pointable at a config file);
      # biblio-title still names the refs section on the page.
      biblio-title: "References"
      biblatexoptions:
        - backend=biber
      block-headings: false
      indent: true
    html:
      template-partials:
        - partials/title-block.html
      css:
        - masthead.css
      include-in-header:
        - assets/favicon.html
      csl: assets/apa-web.csl