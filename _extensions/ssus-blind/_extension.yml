title: SSUS blind manuscript format
author: Eli Knaap
version: 0.0.1
quarto-required: ">=1.4.11"

# The pdfLaTeX-safe blind manuscript — the "submission" copy of Eli's ssus
# paper template (Eli, 2026-10-16, on the template's register: two profiles
# over one prose source — display and submission; submission renders here,
# displays render through the sibling ssus-masthead extension).
#
# Provenance: adapted from hikmah-manuscript v0.0.13's partials (Andrew
# Heiss, andrewheiss/hikmah-academic-quarto, MIT) — the abstract and
# keywords machinery, the running-head page styles, and the correspondence
# structure — with every brand face removed: no fontspec, no mark image, no
# color, no shell-escape; the kept .tex must compile on a journal's own
# build (Editorial Manager's is pdfLaTeX, so the format pins pdflatex —
# quarto's default is lualatex).
#
# Blinding is metadata absence, never editing: the base _quarto.yml carries
# no authorship (profiles cannot remove a merged key — the rentpanel
# lesson); the real author block, thanks, funding, and correspondence live
# in _quarto-pretty.yml and never merge into a render that does not ask for
# them. `anonymous: true` in a project file is a human-facing comment, not a
# machine key. Self-citations (Eli's 2026-10-16 spec: "as the journal
# asks") are kept real in v1 and referred to in third person in the prose;
# the submit.sh checklist is the hygiene net, not the mechanism.
#
# Vendor with its siblings, in full: a partial re-sync once left a stale
# vendor elsewhere in the house and quarto silently fell back to plain
# pdf/html.

contributes:
  formats:
    pdf:
      # its own output name: the submission copy must not stomp the display
      # document's artifacts (both default to the input's stem)
      output-file: blind
      documentclass: article
      papersize: letter
      fontsize: 12pt
      linestretch: 2
      geometry:
        - top=1in
        - bottom=1in
        - left=1in
        - right=1in
      indent: true
      block-headings: false
      keep-tex: true
      pdf-engine: pdflatex
      cite-method: citeproc
      csl: assets/apa.csl
      link-citations: true
      colorlinks: true
      linkcolor: black
      urlcolor: black
      citecolor: black
      biblio-title: "References"
      template-partials:
        - partials/before-title.tex
        - partials/title.tex
        - partials/before-body.tex
      include-in-header:
        - include-in-header.tex