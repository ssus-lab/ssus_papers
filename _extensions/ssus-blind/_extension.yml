title: SSUS blind manuscript format
author: Eli Knaap
version: 0.0.4
quarto-required: ">=1.4.11"

# The pdfLaTeX-safe blind manuscript — the "submission" copy of Eli's ssus
# paper template (Eli, 2026-10-16, on the template's register: two profiles
# over one prose source — display and submission; submission renders here,
# displays render through the sibling ssus-masthead extension).
#
# Provenance: adapted from hikmah-manuscript v0.0.13's partials (Andrew
# Heiss, andrewheiss/hikmah-academic-quarto, MIT) — the abstract and
# keywords machinery, the running-head page styles, and the correspondence
# structure — with every brand face removed: no fontspec, no mark image, no
# color, no shell-escape; the kept .tex must compile on a journal's own
# build (Editorial Manager's is pdfLaTeX, so the format pins pdflatex —
# quarto's default is lualatex).
#
# Blinding by construction, never editing: the project's config carries the
# real author block, thanks, funding, and correspondence (the display copy
# and the title page read them), and this format omits them. blind.lua drops
# every identity key from the metadata before pandoc writes the .tex, so no
# author-derived line reaches the kept source — hyperref's pdfauthor
# included; title.tex emits no author and the header turns \thanks into a
# no-op, as backstops. (Profiles cannot remove a merged key — the rentpanel
# lesson — so removal-by-profile was never sound.) Self-citations (Eli's
# 2026-10-16 spec: "as the journal asks") are kept real and referred to in
# third person in the prose; the submission checklist is the hygiene net,
# not the mechanism.
#
# The journal bundle is staged by ssus_papers.submit (python/ in this repo,
# installed by pixi from the same tag), run after this render and the title
# page's: `python -m ssus_papers.submit MANUSCRIPT`. Until v0.0.6 it was
# submit.sh, beside this file.
#
# Install as a dependency with its siblings, never by copying the folders
# in: `quarto add ssus-lab/ssus_papers@<tag>`. A hand copy, partially
# re-synced, once left a stale format elsewhere in the house, and quarto
# silently fell back to plain pdf/html.

contributes:
  # blind.lua as a plain filter too, so a profile can list it
  # (`filters: [ssus-blind]`, as the template's _quarto-blind.yml does):
  # every render under that profile then omits the identity, whatever the
  # format — qdiff's typst included.
  filters:
    - blind.lua
  formats:
    # The source a journal's portal receives, as a real output: blind.tex,
    # written beside blind.pdf in the profile's output-dir and never touched
    # by another copy's render. (A pdf format's keep-tex always lands as
    # <stem>.tex beside the input, where the next pdf render of the same
    # input deletes it.) Keep these options identical to pdf's below:
    # YAML merge keys lose options in an extension file (Quarto 1.11.9).
    latex:
      output-file: blind
      documentclass: article
      papersize: letter
      fontsize: 12pt
      linestretch: 2
      geometry:
        - top=1in
        - bottom=1in
        - left=1in
        - right=1in
      indent: true
      block-headings: false
      cite-method: citeproc
      csl: assets/apa.csl
      link-citations: true
      colorlinks: true
      linkcolor: black
      urlcolor: black
      citecolor: black
      biblio-title: "References"
      filters:
        - path: blind.lua
          at: post-render
      template-partials:
        - partials/before-title.tex
        - partials/title.tex
        - partials/before-body.tex
      include-in-header:
        - include-in-header.tex
    pdf:
      # its own output name: the submission copy must not stomp the display
      # document's artifacts (both default to the input's stem)
      output-file: blind
      # and its own compile directory: quarto compiles <stem>.tex to
      # <stem>.pdf and then renames it to the output-file, which deleted the
      # display copy's <stem>.pdf beside the input in a project that keeps
      # every copy in one folder. Quarto removes the directory after the
      # compile.
      latex-output-dir: _blind
      documentclass: article
      papersize: letter
      fontsize: 12pt
      linestretch: 2
      geometry:
        - top=1in
        - bottom=1in
        - left=1in
        - right=1in
      indent: true
      block-headings: false
      pdf-engine: pdflatex
      cite-method: citeproc
      csl: assets/apa.csl
      link-citations: true
      colorlinks: true
      linkcolor: black
      urlcolor: black
      citecolor: black
      biblio-title: "References"
      filters:
        - path: blind.lua
          at: post-render
      template-partials:
        - partials/before-title.tex
        - partials/title.tex
        - partials/before-body.tex
      include-in-header:
        - include-in-header.tex