project:
  type: default

# Each copy is a profile with its own formats and output folder; a bare
# render under it builds that copy and nothing else:
#
#   quarto render template.qmd                            # working paper
#   quarto render template.qmd --profile blind            # blind manuscript
#   quarto render title-page.qmd --profile titlepage      # title page
#
# working (_quarto-working.yml, the default): ssus-masthead pdf and html,
#   into _output/working/
# blind (_quarto-blind.yml): ssus-blind pdf and latex, into _output/blind/
# titlepage (_quarto-titlepage.yml): the page's own pdf and latex formats,
#   into _output/titlepage/
#
# This base names NO format: a profile's format map merges with a base
# format map, and a bare render under the blind profile then built every
# copy's formats (Quarto 1.11.9).
#
# This file carries what the copies share — title, abstract, keywords,
# date, bibliography, and the full author block. The COPIES decide what
# they emit: the masthead prints the identity; the blind format omits it
# by construction (blind.lua drops it before pandoc writes the .tex —
# profiles merge, so removal by profile was never sound: the rentpanel
# lesson); the title page reads the block in full from here.
profile:
  default: working

title: "A working paper specimen"
abstract: >-
  One paragraph set in the display and blind targets, exercising the type,
  the series line, and the footer rule.
keywords: [specimen, masthead]

author:
  - name: Eli Knaap
    email: eknaap@uci.edu
    orcid: 0000-0001-7520-2238
    attributes:
      corresponding: true
    affiliations:
      - name: University of California, Irvine
        department: Department of Urban Planning and Public Policy
        address: Social Ecology II
        city: Irvine
        region: CA
        postal-code: "92697"
        country: USA

thanks: >-
  The specimen's acknowledgments, printed on the title page only.
funding-statement: >-
  The specimen's funding statement, as the journal's title page asks for it.
additional-info: >-
  Data and code availability and declarations go here (the hikmah
  catch-all), as the journal requires.
correspondence-prefix: "Correspondence:"